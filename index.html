<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Dịch Vụ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl p-6 max-w-lg w-full">
        <h1 class="text-2xl font-bold text-center text-sky-600 mb-6">📝 Đăng Ký Dịch Vụ</h1>

        <form id="formDichVu" class="space-y-4">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">👤 Tên của bạn</label>
                <input type="text" id="ten" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1">🛠️ Dịch vụ bạn muốn</label>
                <textarea id="dichvu" required rows="3" placeholder="Mô tả yêu cầu..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-2">📱 Phương thức liên lạc</label>
                <div class="flex gap-4">
                    <label class="inline-flex items-center gap-1">
                        <input type="radio" name="pt" value="Zalo" checked> Zalo
                    </label>
                    <label class="inline-flex items-center gap-1">
                        <input type="radio" name="pt" value="Điện thoại"> Điện thoại
                    </label>
                    <label class="inline-flex items-center gap-1">
                        <input type="radio" name="pt" value="Discord"> Discord
                    </label>
                </div>
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1">✉️ Thông tin / Số liên lạc</label>
                <input type="text" id="lienhe" required placeholder="VD: SĐT, Tên tài khoản..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-lg">✅ Gửi Đăng Ký</button>
        </form>

        <div id="ketqua" class="mt-6 hidden bg-green-50 border border-green-200 rounded-lg p-4 text-sm">
            <p class="font-bold text-green-600 mb-2">✅ Đã gửi thành công về kênh Discord!</p>
            <pre id="noidungKQ" class="whitespace-pre-wrap"></pre>
        </div>
    </div>

    <script>
        // ✅ Đã điền sẵn link webhook của bạn
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1546376101998100550/1G3k2_vwjkpYJyYANhrx2oqUm76n5tFgbBcH2jECYEkDd3AGSBib5OCwyWiUElm4_tTm";

        document.getElementById('formDichVu').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const ten = document.getElementById('ten').value.trim();
            const dichVu = document.getElementById('dichvu').value.trim();
            const ptLienLac = document.querySelector('input[name="pt"]:checked').value;
            const lienHe = document.getElementById('lienhe').value.trim();
            const thoiGian = new Date().toLocaleString('vi-VN');

            const duLieuGui = {
                embeds: [{
                    title: "📩 ĐƠN ĐĂNG KÝ MỚI",
                    color: 3942399,
                    fields: [
                        { name: "👤 Tên", value: ten, inline: false },
                        { name: "🛠️ Dịch vụ", inline: false, value: dichVu || "(Không mô tả thêm)" },
                        { name: "📡 Cách liên hệ", value: ptLienLac, inline: true },
                        { name: "📞 Chi tiết / Liên hệ", value: "|| " + lienHe + " ||", inline: true },
                        { name: "⏰ Thời gian nhận", value: thoiGian, inline: false }
                    ]
                }]
            };

            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=utf-8" },
                    body: JSON.stringify(duLieuGui)
                });

                document.getElementById('noidungKQ').textContent = 
`Tên: ${ten}
Dịch vụ: ${dichVu || "(không có mô tả)"}
Liên hệ qua: ${ptLienLac}
Chi tiết: ${lienHe}`;
                
                document.getElementById('ketqua').classList.remove('hidden');
                this.reset();
            } catch (err) {
                console.error(err);
                alert("❌ Lỗi gửi! Kiểm tra lại mạng hoặc quyền kênh.");
            }
        });
    </script>
</body>
</html>

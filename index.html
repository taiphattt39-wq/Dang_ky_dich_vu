<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Dịch Vụ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl p-6 max-w-lg w-full">
        <h1 class="text-2xl font-bold text-center text-sky-600 mb-6">📝 Đăng Ký Dịch Vụ</h1>

        <form id="formDichVu" class="space-y-4">
            <!-- Tên -->
            <div>
                <label class="block font-semibold text-gray-700 mb-1">👤 Tên của bạn</label>
                <input type="text" id="ten" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>

            <!-- Dịch vụ -->
            <div>
                <label class="block font-semibold text-gray-700 mb-1">🛠️ Dịch vụ bạn muốn</label>
                <textarea id="dichvu" required rows="3" placeholder="Mô tả ngắn gọn dịch vụ/yêu cầu..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
            </div>

            <!-- Phương thức liên lạc -->
            <div>
                <label class="block font-semibold text-gray-700 mb-2">📱 Phương thức liên lạc</label>
                <div class="flex gap-4">
                    <label class="flex items-center gap-1">
                        <input type="radio" name="pt" value="Zalo" checked> Zalo
                    </label>
                    <label class="flex items-center gap-1">
                        <input type="radio" name="pt" value="Điện thoại"> Điện thoại
                    </label>
                    <label class="flex items-center gap-1">
                        <input type="radio" name="pt" value="Discord"> Discord
                    </label>
                </div>
            </div>

            <!-- Thông tin liên hệ -->
            <div>
                <label class="block font-semibold text-gray-700 mb-1">✉️ Thông tin liên hệ</label>
                <input type="text" id="lienhe" required placeholder="Số điện thoại / Tên tài khoản..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-lg transition">✅ Gửi Đăng Ký</button>
        </form>

        <!-- Kết quả hiển thị tại đây -->
        <div id="ketqua" class="mt-6 hidden bg-gray-50 border rounded-lg p-4 text-sm">
            <p class="font-bold text-green-600 mb-2">✅ Đã nhận đăng ký:</p>
            <pre id="noidungKQ" class="whitespace-pre-wrap text-gray-800"></pre>
        </div>
    </div>

    <script>
        const form = document.getElementById('formDichVu');
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Lấy dữ liệu
            const ten = document.getElementById('ten').value;
            const dv = document.getElementById('dichvu').value;
            const pt = document.querySelector('input[name="pt"]:checked').value;
            const lh = document.getElementById('lienhe').value;

            // Hiển thị lại cho rõ
            document.getElementById('noidungKQ').textContent = 
`Tên: ${ten}
Dịch vụ: ${dv}
Phương thức liên lạc: ${pt}
Thông tin: ${lh}
Thời gian: ${new Date().toLocaleString()}`;

            document.getElementById('ketqua').classList.remove('hidden');
            form.reset();
        });
    </script>
</body>
</html>

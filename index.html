<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Dịch Vụ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl p-6 max-w-lg w-full">
        <h1 class="text-2xl font-bold text-center text-sky-600 mb-6">📝 Đăng Ký Dịch Vụ</h1>

        <form id="formDichVu" class="space-y-4">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">👤 Tên của bạn</label>
                <input type="text" id="ten" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1">🛠️ Dịch vụ bạn muốn</label>
                <textarea id="dichvu" required rows="3" placeholder="Mô tả yêu cầu..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-2">📱 Phương thức liên lạc</label>
                <div class="flex gap-4">
                    <label><input type="radio" name="pt" value="Zalo" checked> Zalo</label>
                    <label><input type="radio" name="pt" value="Điện thoại"> Điện thoại</label>
                    <label><input type="radio" name="pt" value="Discord"> Discord</label>
                </div>
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1">✉️ Thông tin liên hệ</label>
                <input type="text" id="lienhe" required placeholder="SĐT/Tên tài khoản..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-lg">✅ Gửi Đăng Ký</button>
        </form>

        <div id="ketqua" class="mt-6 hidden bg-gray-50 border p-4 rounded text-sm">
            <p class="font-bold text-green-600 mb-2">✅ Đã nhận:</p>
            <pre id="noidungKQ" class="whitespace-pre-wrap"></pre>
        </div>
    </div>

    <script>
        document.getElementById('formDichVu').addEventListener('submit', e => {
            e.preventDefault();
            const ten = document.getElementById('ten').value;
            const dv = document.getElementById('dichvu').value;
            const pt = document.querySelector('input[name="pt"]:checked').value;
            const lh = document.getElementById('lienhe').value;

            document.getElementById('noidungKQ').textContent = 
`Tên: ${ten}
Dịch vụ: ${dv}
Liên hệ: ${pt} - ${lh}
Lúc: ${new Date().toLocaleString('vi-VN')}`;
            document.getElementById('ketqua').classList.remove('hidden');
            e.target.reset();
        });
    </script>
</body>
</html>
